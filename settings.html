<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger — Settings</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-shell">

    <div class="mobile-topbar">
  <span>Ledger</span>
  <button type="button" class="logout-btn topbar-logout" aria-label="Log out">
    <i class="ti ti-logout" aria-hidden="true"></i>
  </button>
</div>

<nav class="ledger-tabs">
  <div class="brand">Ledger</div>
  <a href="dashboard.html"><i class="ti ti-layout-dashboard" aria-hidden="true"></i><span>Dashboard</span></a>
  <a href="transactions.html"><i class="ti ti-list-details" aria-hidden="true"></i><span>Transactions</span></a>
  <a href="categories.html"><i class="ti ti-tags" aria-hidden="true"></i><span>Categories</span></a>
  <a href="savings.html"><i class="ti ti-pig-money" aria-hidden="true"></i><span>Savings</span></a>
  <a href="settings.html" class="active"><i class="ti ti-settings" aria-hidden="true"></i><span>Settings</span></a>
  <button type="button" class="logout-btn nav-logout">
    <i class="ti ti-logout" aria-hidden="true"></i><span>Log out</span>
  </button>
</nav>

    <main class="main-content">

      <div class="flex-between mb-4 page-header">
        <div>
          <h1>Settings</h1>
          <p class="text-soft">Manage your account</p>
        </div>
      </div>

      <section class="card mb-4" style="max-width:520px;">
        <h2>Your account</h2>
        <p class="field-hint" style="margin-top:0;">Logged in as</p>
        <p id="settings-email" style="font-weight:600; margin:0;">Loading…</p>
      </section>

      <section class="card mb-4" style="max-width:520px;">
        <h2>Change password</h2>
        <form id="password-form" novalidate>
          <div class="field">
            <label for="current-password">Current password</label>
            <input type="password" id="current-password" autocomplete="current-password" />
          </div>
          <div class="field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" autocomplete="new-password" placeholder="At least 8 characters" />
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn-primary">Update password</button>
          <div id="password-message" class="form-message" role="alert"></div>
        </form>
      </section>

      <section class="card mb-4" style="max-width:520px;">
        <h2>Security question</h2>
        <p class="field-hint" style="margin-top:0;">Current question</p>
        <p id="settings-current-question" style="font-weight:600;">Loading…</p>

        <form id="question-form" novalidate>
          <div class="field">
            <label for="settings-question">New question</label>
            <select id="settings-question">
              <option value="">Choose a question</option>
              <option>What was the name of your first pet?</option>
              <option>What was the name of the street you grew up on?</option>
              <option>What was your childhood best friend's first name?</option>
              <option>What was the make of your first car?</option>
              <option>What was the name of your favourite teacher?</option>
              <option>In what city did your parents meet?</option>
            </select>
          </div>
          <div class="field">
            <label for="settings-answer">Answer</label>
            <input type="text" id="settings-answer" autocomplete="off" />
            <p class="field-hint">Not case-sensitive.</p>
          </div>
          <div class="field">
            <label for="question-current-password">Current password</label>
            <input type="password" id="question-current-password" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary">Update security question</button>
          <div id="question-message" class="form-message" role="alert"></div>
        </form>
      </section>

    </main>
  </div>

</body>
<script src="js/nav.js"></script>
<script src="js/settings.js"></script>
</html>
