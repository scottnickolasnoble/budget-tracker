<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger — Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-shell">

    <!-- SIDEBAR NAV: the "ledger tabs". class="active" marks the
         current page — for now it's hardcoded on Dashboard, later
         your JS (or just editing the class per page) controls this. -->
    <nav class="ledger-tabs">
      <div class="brand">Ledger</div>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="transactions.html">Transactions</a>
      <a href="categories.html">Categories</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>

    <main class="main-content">

      <div class="flex-between mb-4">
        <div>
          <h1>Dashboard</h1>
          <p class="text-soft" id="dashboard-date">Loading date…</p>
        </div>
        <div class="flex gap-3">
          <!-- Toggle for "Income mode" from your spec: hides cash-balance
               tracking and just shows totals/accumulation. Your JS will
               listen for this and show/hide widgets accordingly. -->
          <button class="btn btn-secondary" id="income-mode-toggle" type="button" aria-pressed="false">
            Income mode: Off
          </button>
          <button class="btn btn-secondary" id="edit-layout-btn" type="button">
            Edit widgets
          </button>
          <button class="btn btn-primary" id="add-transaction-btn" type="button">
            + Add transaction
          </button>
        </div>
      </div>

      <!-- WIDGET GRID: each .card is one widget. data-widget names them
           so your JS can find, reorder, show/hide, or save layout
           preferences (this is the "totally customizable" requirement —
           the HTML/CSS just needs to render whatever widget list JS
           decides is active). -->
      <section class="widget-grid" id="widget-container"></section>

      <!-- CATEGORY LIMITS: a wider card showing progress toward each
           category's budget limit. Structured as a list so JS can
           generate one .limit-row per category from your data. -->
      <section class="card mt-4">
        <div class="flex-between mb-4">
          <h2 style="margin-bottom:0;">Category limits</h2>
          <a href="categories.html" style="font-size:0.875rem;">Manage categories →</a>
        </div>

        <div id="category-limits-list">
          <!-- Example row — your JS will loop over categories and
               render one of these per category. Structure to copy:
               <div class="limit-row"> tag, spent/limit figures, bar -->
          <div class="limit-row" data-category="groceries">
            <div class="flex-between mb-2">
              <span class="tag">Groceries</span>
              <span class="text-soft" style="font-size:0.875rem;">
                <span class="figure" id="groceries-spent">$0</span> of
                <span class="figure" id="groceries-limit">$0</span>
              </span>
            </div>
            <div class="limit-bar">
              <div class="limit-bar-fill" id="groceries-bar" style="width: 0%;"></div>
            </div>
          </div>
        </div>

        <p class="field-hint mt-4" id="category-limits-empty">
          No categories with limits yet — set one up on the Categories page.
        </p>
      </section>

      <!-- CHART: placeholder container. Your JS will draw into this
           (e.g. with Chart.js or a canvas you build yourself) once
           we get to charts — for now it's just a sized, styled box. -->
      <section class="card mt-4">
        <h2>Spending by category</h2>
        <div id="chart-container" style="height: 260px; display:flex; align-items:center; justify-content:center; border: 1px dashed var(--line); border-radius: var(--radius-sm);">
          <p class="text-soft" style="margin:0;">Chart renders here</p>
        </div>
      </section>

    </main>
  </div>

</body>
<footer style="text-align: center; padding: 10px; color: #888;">
  Made by Scott Noble - Version B
</footer>
<script src="js/dashboard.js"></script>
<script src="js/widgets.js"></script>
</html>
