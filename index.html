<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger — Log In</title>

  <!-- Google Fonts: display serif for headings, Inter for body text,
       IBM Plex Mono for anything money-related (see styles.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="center-screen">
    <div class="card" style="width: 100%; max-width: 380px;">

      <div class="text-center mb-4">
        <h1 style="margin-bottom: 4px;">Ledger</h1>
        <p class="text-soft">Log in to your budget</p>
      </div>

      <!-- id="login-form" is what your JavaScript will hook into with
           document.getElementById('login-form').addEventListener('submit', ...)
           We're using type="email"/"password" so the browser gives us
           free validation (format checking, password masking) for nothing. -->
      <form id="login-form" novalidate>

        <div class="field" id="email-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <p class="field-error">Enter a valid email address.</p>
        </div>

        <div class="field" id="password-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8" />
          <p class="field-error">Password must be at least 8 characters.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>

        <!-- This is where your JS can print login errors from the
             database ("Wrong password", "No account found", etc). -->
        <p id="login-message" class="field-hint text-center mt-4" role="status"></p>

      </form>

      <p class="text-center text-soft mt-4" style="font-size: 0.875rem;">
        New here? <a href="#">Create an account</a>
      </p>

    </div>
  </div>

</body>
<script src="js/login.js"></script>
</html>
